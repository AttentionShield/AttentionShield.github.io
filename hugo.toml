baseURL = 'https://example.com/'
theme = 'PaperMod'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
title = 'MindSaver'
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
summaryLength = 30
timeZone = 'Asia/Shanghai'

# 固定构建时间，保证每次生成结果一致（避免无意义 diff）
disableHugoGeneratorInject = true

[pagination]
  pagerSize = 15

[permalinks]
  posts = '/posts/:year/:month/:slug/'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[minify]
  disableXML = true
  minifyOutput = true

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      # ::: 提示 / ::: 注意 / ::: 警告 语法块（alert 需要表格形式）
      alert = { }
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true          # 允许文章内写 HTML
      hardWraps = false
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true         # 允许 ::: 提示块
        title = true
  [markup.highlight]
    noClasses = false        # 用 CSS 类，便于跟随主题切换
    lineNos = false
    guessSyntax = true
    # github-light 与浅色底搭配；深色模式由自定义 CSS 覆盖
    style = 'github'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[services]
  [services.rss]
    limit = 30

# 全站搜索索引（供 PaperMod 的 fuse.js 使用）
[outputFormats]
  [outputFormats.JSON]
    mediaType = 'application/json'
    baseName = 'index'
    isPlainText = true
    notAlternative = true

[params]
  env = 'production'
  description = '一个专注于内容本身的技术博客。'
  author = 'MindSaver'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = false
  ShowToc = true
  ShowBreadCrumbs = false        # 极简：不要面包屑
  ShowPostNavLinks = true        # 文末上一篇/下一篇
  ShowCodeCopyButton = true
  ShowRssButtonInSectionTermList = true
  ShowFullText = false           # 列表页不显示全文，只出摘要
  disableAnchoredHeadings = true # 标题不显示 # 锚点符号
  disableSpecial = true          # 去掉 Hugo 默认的特殊渲染（emoji 短代码等）
  mainSections = ['posts']
  DateFormat = '2006年1月2日'
  # 首页显示多少篇文章；设为 0 表示全部列出
  homePostsCount = 0

  [params.label]
    text = 'Hi,MindSaver'
    icon = ''
    iconHeight = 30
    iconSVG = ''

  # 首页不放头像大图块，直接进文章列表 —— 内容优先
  profileMode = false

  [params.homeInfoParams]
    Title = 'MindSaver 的技术笔记'
    Content = '写代码、踩坑、读书的地方。这里只有文字。'

  [params.assets]
    favicon = 'favicon.png'
    logo = ''
  assets = 'favicon.png'

  [[params.assets.fonts]]
    name = 'body font'
    url = ''

  # 站内搜索：PaperMod 用 fuse.js，索引输出到 /index.json
  fuseOpts = { isCaseSensitive = false, shouldSort = true, ignoreLocation = true, threshold = 0.1, keys = ["title", "tags", "categories", "summary", "content"] }

  [params.footer]
    since = '2026'
    hideCopyright = false

[menus]
  [[menus.main]]
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menus.main]]
    name = '归档'
    url = '/archives/'
    weight = 20
  [[menus.main]]
    name = '标签'
    url = '/tags/'
    weight = 30
  [[menus.main]]
    name = '搜索'
    url = '/search/'
    weight = 35
  [[menus.main]]
    name = '关于'
    url = '/about/'
    weight = 40
